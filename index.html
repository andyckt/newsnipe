<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Only Recording App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="mobileOnly">
        <h1>Voice Recording App</h1>
        <p>Press the button below to start recording</p>
        <button id="recordButton" class="recording-btn">Start Recording</button>
        <button id="submitButton" class="submit-btn">Submit Recording</button>
        <p id="status"></p>
        <div id="audioPlayback"></div>
    </div>
    
    <div id="desktopWarning">
        <h1>Mobile Access Only</h1>
        <p>This application is designed for mobile devices only.</p>
        <p>Please access this website from your smartphone or tablet.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
